services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: penguin
      POSTGRES_PASSWORD: penguin
      POSTGRES_DB: penguinchat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penguin -d penguinchat"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://penguin:penguin@postgres:5432/penguinchat
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      ACCESS_TTL: 15m
      REFRESH_TTL: 30d
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "${PENGUINCHAT_API_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build:
      context: ./client
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PENGUINCHAT_APP_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  pgdata:
